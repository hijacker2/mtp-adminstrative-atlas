<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A Digital Humanities research atlas studying the administrative production of income certificates across four Indian states."
    />
    <meta name="theme-color" content="#f5f2e9" />
    <title>Administrative Landscape — MTP Administrative Atlas</title>
    <script>
      (() => {
        try {
          const mode = localStorage.getItem('mtp-atlas-theme');
          const dark = mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#222321' : '#f5f2e9');
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
